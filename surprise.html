<!DOCTYPE html>

<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}main{max-width:620px;margin:auto;padding:20px 16px 50px}.comic{height:138px;background:linear-gradient(120deg,#d5ebbf,#b8e5e4);border:4px solid #282622;overflow:hidden;position:relative;display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:8px;transform:rotate(-1deg)}.comic:before{content:'';position:absolute;bottom:-20px;left:-10px;width:115%;height:62px;border-top:9px solid #6cb8e4;background:#b7dcf6;transform:rotate(-9deg)}.comic span{z-index:1;font-weight:900;font-size:24px;line-height:1.4;letter-spacing:-1px;text-shadow:3px 3px #fff;transform:rotate(-4deg)}.comic .shout{font-size:37px;color:#3b6ba1;transform:rotate(10deg);white-space:nowrap}.card{text-align:center;margin-top:42px}.gotcha{font-size:34px;font-weight:900;letter-spacing:-1.2px;margin:0 0 8px;animation:pop .6s ease-out}.lead{color:#777;font-size:15px;margin:0 0 22px}.llama{display:block;width:100%;max-width:360px;margin:0 auto;filter:drop-shadow(1px 4px 1px #00000009)}.message{font-size:29px;font-weight:900;letter-spacing:-1.5px;line-height:1.35;margin:12px 0}.note{font-size:13px;color:#969696;margin-top:10px;line-height:1.6}.emoji{font-size:28px}.back{border:0;border-radius:12px;background:#fee500;padding:14px 25px;margin-top:24px;font-weight:800;font-size:15px;cursor:pointer}footer{font-size:11px;color:#aaa;margin-top:35px;text-align:center}@keyframes pop{0%{transform:scale(.85) rotate(-3deg)}70%{transform:scale(1.04) rotate(2deg)}100%{transform:scale(1)}}</style></head>
