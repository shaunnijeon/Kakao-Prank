<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#aec5d5"><meta property="og:type" content="website"><meta property="og:title" content="송금보내요"><meta property="og:description" content="선물을 확인해 보세요."><meta property="og:image" content="assets/card-hero.png"><title>송금 받기</title>
<style>*{box-sizing:border-box}body{margin:0;background:#aec5d5;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:25px 16px}.card{width:100%;max-width:490px;overflow:hidden;border-radius:23px;background:#fff;box-shadow:0 20px 60px #223d5630}.hero{display:block;width:100%;aspect-ratio:1200/570;object-fit:cover}.content{padding:26px 20px 10px}.amount{font-size:22px;letter-spacing:-.9px;margin:0 0 12px}.info{font-size:14px;color:#848484;margin:0 0 22px;line-height:1.5}button{display:block;border:0;border-radius:11px;background:#eee;color:#303030;width:100%;padding:18px;font-size:18px;font-weight:600;cursor:pointer}.foot{font-size:12px;color:#888;padding:17px 20px 22px}.foot span{float:right}.note{font-size:11px;color:#42586a;text-align:center;margin-top:14px}</style></head><body><div><section class="card"><img class="hero" src="assets/card-hero.png" alt="하트를 든 곰과 송금보내요라는 글이 있는 노란 카드"><div class="content"><p class="amount" id="amount">1,000,000원을 보냈어요.</p><p class="info">송금 받기 전까지 보낸 분은 내역 상세화면에서 취소할 수 있어요.</p><button id="reveal">송금 받기</button></div><div class="foot">🎁 재미용 카드 <span>›</span></div></section><div class="note">비공식 장난 페이지 · 실제 금전 거래가 일어나지 않습니다.</div></div><script>let n=new URLSearchParams(location.search).get('amount');if(n&&/^\d[\d,]*$/.test(n)&&n.length<20){document.getElementById('amount').textContent=n+'원을 보냈어요.';}document.getElementById('reveal').onclick=()=>location.href=new URL('surprise.html',location.href).href;</script></body></html>
